org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
# En Linux/Windows los objetivos iOS no se pueden compilar: se omiten sin aviso.
kotlin.native.ignoreDisabledTargets=true
android.useAndroidX=true
# Versión de Aurora: única fuente para escritorio (instaladores), Android (versionName) y Ajustes › Acerca de.
# Cada instalador nuevo de Windows necesita una versión mayor; en Android, subir también aurora.versionCode.
aurora.version=0.4.0
aurora.versionCode=3
